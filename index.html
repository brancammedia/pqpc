const searchInput = document.getElementById('searchInput');
const categoryFilter = document.getElementById('categoryFilter');
const tableBody = document.getElementById('tableBody');
const productCount = document.getElementById('productCount');
const categoryCount = document.getElementById('categoryCount');
const newItemCount = document.getElementById('newItemCount');

data.categories.forEach(cat => {
    const option = document.createElement('option');
    option.value = cat;
    option.textContent = cat;
    categoryFilter.appendChild(option);
});

categoryCount.textContent = data.categories.length;
newItemCount.textContent = data.products.filter(p => p.note && p.note.includes('New Item')).length;

function formatPrice(price) {
    if (price === null || price === undefined) return '—';
    return '$' + price.toFixed(2);
}

function highlightText(text, query) {
    if (!query) return text;
    const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return text.replace(regex, '<span class="highlight">$1</span>');
}

function renderTable(products, query = '') {
    tableBody.innerHTML = '';
    if (products.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" class="no-results"><h3>No products found</h3><p>Try adjusting your search or filter</p></td></tr>';
        productCount.textContent = '0';
        return;
    }
    products.forEach(p => {
        const row = document.createElement('tr');
        var specCell = p.spec_url ? '<a href="' + p.spec_url + '" target="_blank" class="spec-link" title="View Spec Sheet">📄</a>' : '';
        row.innerHTML = 
            '<td><span class="category-badge">' + highlightText(p.category, query) + '</span></td>' +
            '<td class="sku">' + highlightText(p.sku, query) + '</td>' +
            '<td class="desc">' + (p.description || '') + '</td>' +
            '<td class="price">' + formatPrice(p.price_10) + '</td>' +
            '<td class="price">' + formatPrice(p.price_5) + '</td>' +
            '<td class="spec-cell">' + specCell + '</td>' +
            '<td class="note-cell">' + (p.note || '') + '</td>';
        tableBody.appendChild(row);
    });
    productCount.textContent = products.length;
}

function filterProducts() {
    const query = searchInput.value.toLowerCase().trim();
    const category = categoryFilter.value;
    
    let filtered = data.products;
    
    if (category) {
        filtered = filtered.filter(p => p.category === category);
    }
    
    if (query) {
        filtered = filtered.filter(p => 
            p.sku.toLowerCase().includes(query) || 
            p.category.toLowerCase().includes(query)
        );
    }
    
    // Sort to put new items at the top
    filtered = filtered.sort((a, b) => {
        const aIsNew = a.note && a.note.includes('New Item');
        const bIsNew = b.note && b.note.includes('New Item');
        if (aIsNew && !bIsNew) return -1;
        if (!aIsNew && bIsNew) return 1;
        return 0;
    });
    
    renderTable(filtered, query);
}

searchInput.addEventListener('input', filterProducts);
categoryFilter.addEventListener('change', filterProducts);

filterProducts();
